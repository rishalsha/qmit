[package]
name = "qmit"
version = "0.1.0"
edition = "2021"
description = "AI-powered conventional commit generator and assistant"
authors = ["Rishal"]
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
inquire = { version = "0.7", features = ["editor"] }
colored = "2.1"
indicatif = "0.17"
dirs = "5.0"
anyhow = "1.0"
tempfile = "3.10"
