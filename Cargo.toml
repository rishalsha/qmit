[package]
name = "qmit"
version = "1.0.0"
edition = "2021"
description = "Blazing-fast AI-powered conventional commit generator CLI"
authors = ["Muhammad Rishal P"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/rishalsha/qmit"
homepage = "https://github.com/rishalsha/qmit"
keywords = ["git", "commit", "conventional-commits", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
inquire = { version = "0.7", features = ["editor"] }
colored = "2.1"
indicatif = "0.17"
dirs = "5.0"
anyhow = "1.0"
tempfile = "3.10"
